<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanári anyagok</title>
<meta name="description" content="Látványtervek a négy personához – tanári anyag, jelszóval védve.">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128444;</text></svg>">
<style>
  figure{margin:0 0 30px}
  figure img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);
             box-shadow:var(--shadow)}
  figure h2{font-size:1rem;margin:0 0 9px;color:var(--ink-2)}
  .spoiler{background:var(--surface);border:2px solid var(--accent);border-radius:12px;
           padding:16px 18px;margin-bottom:28px}

  html.zar body > .wrap{display:none}
  #kapu{max-width:420px;margin:16vh auto 0;background:var(--surface);border:1px solid var(--line);
        border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);text-align:left}
  #kapu h2{margin:0 0 6px;font-size:1.15rem}
  #kapu p{margin:0 0 16px;color:var(--ink-3);font-size:.92rem}
  #kapu input{width:100%;margin-bottom:10px}
  #kapu .hiba{color:#B5541F;font-size:.86rem;margin:0;display:none}
  html:not(.zar) #kapu{display:none}
</style>

<script>
(function(){
  var H = 375689741, KULCS = 'tk-oktatoi';
  function hash(s){ var x=5381; for(var i=0;i<s.length;i++){ x=((x*33)^s.charCodeAt(i))>>>0; } return x; }
  var nyitva = false;
  try { nyitva = sessionStorage.getItem(KULCS) === '1'; } catch(e){}
  if (!nyitva) document.documentElement.classList.add('zar');
  document.addEventListener('DOMContentLoaded', function(){
    var f = document.getElementById('kapuform');
    if (!f) return;
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var v = document.getElementById('kapujelszo').value.trim();
      if (hash(v) === H){
        try { sessionStorage.setItem(KULCS,'1'); } catch(e){}
        document.documentElement.classList.remove('zar');
      } else {
        document.getElementById('kapuhiba').style.display='block';
        document.getElementById('kapujelszo').value='';
      }
    });
  });
})();
</script>
</head>
<body>

<div id="kapu">
  <h2>Tanári anyagok</h2>
  <p>A látványtervek csak a bemutatók után kerülnek elő. Add meg a jelszót.</p>
  <form id="kapuform" autocomplete="off">
    <input type="password" id="kapujelszo" placeholder="Jelszó" aria-label="Jelszó" autofocus>
    <button class="btn" type="submit">Belépés</button>
  </form>
  <p class="hiba" id="kapuhiba">Nem jó jelszó.</p>
</div>

<div class="wrap">
<a class="backlink" href="index.html">&larr; Vissza az áttekintéshez</a>

<header class="page">
  <h1>Tanári anyagok</h1>
</header>

<figure>
  <h2>Csaba · Kutatótér</h2>
  <img src="assets/img/terv-csaba.jpg" alt="Csaba kutatótere – két változat: praktikus kutatóműhely és rugalmas természettudományos labor" loading="lazy">
</figure>

<figure>
  <h2>Laura · Irodalmi labor</h2>
  <img src="assets/img/terv-laura.jpg" alt="Laura irodalmi labora – két változat: olvasás és beszélgetés, illetve dráma és alkotás" loading="lazy">
</figure>

<figure>
  <h2>Dániel · Digitális alkotóműhely</h2>
  <img src="assets/img/terv-daniel.jpg" alt="Dániel digitális alkotóműhelye – két változat: együttműködő digitális tanterem és projektstúdió" loading="lazy">
</figure>

<figure>
  <h2>Nóra · Közösségi tér</h2>
  <img src="assets/img/terv-nora.jpg" alt="Nóra közösségi tere – két változat: fórum és kiállítótér, illetve osztható rendezvénytér" loading="lazy">
</figure>

</div>
</body>
</html>
